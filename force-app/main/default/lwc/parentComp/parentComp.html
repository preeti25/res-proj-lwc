<template>
    <lightning-card title="Parent Component">
        <div class="slds-p-horizontal_medium">
            
        <c-child-comp first-name="Preeti" last-name="Sharma"></c-child-comp>
        <c-child-comp first-name="ajay" last-name="singh"></c-child-comp>
        <lightning-input type="number" label="Enter Age" value={age} onchange={handleChange}></lightning-input>

        <template lwc:if={seniorCitizen}>
            <c-second-child msg="You are a senior citizen."></c-second-child>
        </template>
        <template lwc:elseif={eligibleforVote}>
            <c-first-child message="You are eligible for voting."></c-first-child>
        </template>
        <template lwc:elseif={notEligibleforVote}>
            <c-first-child message="You are not eligible for voting."></c-first-child>
        </template>
        
        </div>
    </lightning-card>
</template>
