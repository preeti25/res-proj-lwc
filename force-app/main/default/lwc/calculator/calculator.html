<template>
    <lightning-card title="Simple Calculator" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
            <lightning-input type="number" label="Value 1" value={calval1} onchange={handleValue1Change}></lightning-input>
            <lightning-input type="number" label="Value 2" value={calval2} onchange={handleValue2Change}></lightning-input>
            <lightning-button label="Add" onclick={handleAdd}></lightning-button>
            <lightning-button label="Subtract" onclick={handleSubtract}></lightning-button>
            <lightning-button label="Multiply" onclick={handleMultiply}></lightning-button>
            <lightning-button label="Divide" onclick={handleDivide}></lightning-button>
            <lightning-button label="Clear" onclick={handleClear}></lightning-button>
            <p>Result: {result}</p>
        </div>
    </lightning-card>
    
</template>
