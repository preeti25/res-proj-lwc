<template>

    <lightning-card title="Multiple Resource Allocation">

        <div class="slds-p-around_medium">

            <template for:each={rows} for:item="row" for:index="index">

                <div key={row.key}
                     class="slds-box slds-m-bottom_small">

                    <lightning-record-edit-form
                        object-api-name="Resource_Allocation__c">

                        <div class="slds-grid slds-wrap slds-gutters">

                            <!-- Resource -->
                            <div class="slds-col slds-size_1-of-2">

                                <lightning-input-field
                                    field-name="Resource__c"
                                    data-index={index}
                                    onchange={handleResourceChange}>
                                </lightning-input-field>

                            </div>

                            <!-- Start Date Time -->
                            <div class="slds-col slds-size_1-of-2">

                                <lightning-input-field
                                    field-name="Allocation_Start_Date_Time__c"
                                    data-index={index}
                                    onchange={handleStartChange}
                                    required>
                                </lightning-input-field>

                            </div>

                            <!-- End Date Time -->
                            <div class="slds-col slds-size_1-of-2">

                                <lightning-input-field
                                    field-name="Allocation_End_Date_Time__c"
                                    data-index={index}
                                    onchange={handleEndChange}
                                    required>
                                </lightning-input-field>

                            </div>

                            <!-- Remove Button -->
                            <div class="slds-col slds-size_1-of-2 slds-m-top_large">

                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    alternative-text="Delete"
                                    data-index={index}
                                    onclick={removeRow}>
                                </lightning-button-icon>

                            </div>

                        </div>

                    </lightning-record-edit-form>

                </div>

            </template>

            <!-- Buttons -->
            <lightning-button
                label="Add Row"
                onclick={addRow}>
            </lightning-button>

            <lightning-button
                label="Save"
                variant="brand"
                class="slds-m-left_small"
                onclick={saveRecords}>
            </lightning-button>

        </div>

    </lightning-card>

</template>
