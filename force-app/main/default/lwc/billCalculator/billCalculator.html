<template>
    <lightning-card title="Calculate Bill Amount with GST" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
            <lightning-input type="number" label="Amount" value={amount} onchange={handleAmountChange}></lightning-input>
            <lightning-input type="number" label="Quantity" value={quantity} onchange={handleQuantityChange}></lightning-input>
            
            <p>Sub Amount: {subTotalAmount}</p>
            <p>18% GST: {gstAmount}</p>
            <p>Total Bill Amount: {totalAmount}</p> 
        </div>
    </lightning-card>
    
</template>
